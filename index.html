<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Camera (MediaPipe)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app-container">
    <!-- Top Bar / Header -->
    <div id="top-bar">
      <div class="brand">ASCII_CAM_V2</div>
      <div class="osd-group">
        <div class="osd-item" id="rec-indicator">
          <div class="rec-dot"></div> REC
        </div>
        <div class="osd-item">ISO 800</div>
        <div class="osd-item" id="time-display">00:00:00</div>
        <div class="osd-item" id="battery-display">BAT --%</div>
      </div>
    </div>

    <!-- Main Viewfinder -->
    <div id="viewfinder">
      <!-- Video Elements (Hidden) -->
      <video id="video" autoplay playsinline class="hidden" style="display: none;"></video>
      <canvas id="canvas" class="hidden" style="display: none;"></canvas>

      <!-- Display Elements -->
      <pre id="ascii"></pre>

      <!-- OSD Overlays -->
      <div class="viewfinder-overlay">
        <div class="vf-corners"></div>
        <div class="vf-crosshair"></div>
      </div>
    </div>

    <!-- Control Deck / Footer -->
    <div id="control-deck">
      <div class="deck-left">
        <select id="palette" class="cam-control">
          <option value="extended" selected>Extended</option>
          <option value="basic">Basic</option>
          <option value="blocks">Blocks</option>
          <option value="matrix">Matrix</option>
          <option value="sketch">Sketch</option>
          <option value="deep">Deep</option>
          <option value="custom">Custom</option>
        </select>

        <label class="toggle-switch">
          <input type="checkbox" id="bgToggle" />
          <div class="toggle-indicator"></div>
          <span>RM BG</span>
        </label>
      </div>

      <div id="shutter-container">
        <div class="mode-switch">
          <div class="mode-option active" id="mode-photo">PHOTO</div>
          <div class="mode-option" id="mode-video">VIDEO</div>
        </div>
        <div id="shutter-btn" title="Capture">
          <div id="shutter-inner"></div>
        </div>
      </div>

      <div class="deck-right">
        <label class="toggle-switch" id="mic-toggle-container" style="display: none;">
          <input type="checkbox" id="micToggle" />
          <div class="toggle-indicator"></div>
          <span>MIC</span>
        </label>

        <label style="display: flex; align-items: center; gap: 5px;">
          <span>RES</span>
          <input type="range" id="resSlider" min="10" max="60" step="10" value="30" />
        </label>

        <button id="themeToggle" class="cam-control" title="Toggle Theme">🌙</button>
      </div>
    </div>
  </div>

  <script>
    // --- Clock & Timer ---
    let recordingStartTime = 0;
    let recordingInterval = null;

    function updateTime() {
      if (recordingInterval) {
        const diff = Date.now() - recordingStartTime;
        const s = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
        const m = Math.floor((diff / 1000 / 60) % 60).toString().padStart(2, '0');
        const h = Math.floor((diff / 1000 / 3600)).toString().padStart(2, '0');
        document.getElementById('time-display').textContent = `${h}:${m}:${s}`;
        document.getElementById('time-display').style.color = 'var(--cam-accent)';
      } else {
        const now = new Date();
        document.getElementById('time-display').textContent = now.toLocaleTimeString('en-US', { hour12: false });
        document.getElementById('time-display').style.color = '';
      }
    }
    setInterval(updateTime, 1000);
    updateTime();

    // --- Battery Status ---
    if ('getBattery' in navigator) {
      navigator.getBattery().then(battery => {
        const updateBat = () => {
          const level = Math.round(battery.level * 100);
          const charging = battery.charging ? '⚡' : '';
          document.getElementById('battery-display').textContent = `BAT ${level}%${charging}`;
        };
        updateBat();
        battery.addEventListener('levelchange', updateBat);
        battery.addEventListener('chargingchange', updateBat);
      });
    } else {
      document.getElementById('battery-display').textContent = "BAT --%";
    }

    // --- Core Logic ---
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true, alpha: false });
    const asciiEl = document.getElementById("ascii");
    const paletteSel = document.getElementById("palette");
    const bgToggle = document.getElementById("bgToggle");
    const resSlider = document.getElementById("resSlider");
    const themeToggle = document.getElementById("themeToggle");

    // Recording Canvas (for ASCII mode)
    const recordingCanvas = document.createElement('canvas');
    const rctx = recordingCanvas.getContext('2d');

    let chars = "";
    let scale = 0.25;
    let fontSize = 6;
    const MIRROR = true;
    let ready = false;
    let charW = 6;
    let charH = 6;
    let charMetricsDirty = true;

    window.addEventListener('resize', () => { charMetricsDirty = true; });

    const maskCanvas = document.createElement("canvas");
    const mctx = maskCanvas.getContext("2d", { willReadFrequently: true, alpha: false });

    // Disable smoothing
    [ctx, mctx, rctx].forEach(c => {
      c.imageSmoothingEnabled = false;
      c.msImageSmoothingEnabled = false;
      c.mozImageSmoothingEnabled = false;
      c.webkitImageSmoothingEnabled = false;
      c.imageSmoothingQuality = 'low';
    });

    let removeBg = false;
    bgToggle.addEventListener('change', () => { removeBg = bgToggle.checked; });

    // Theme Logic
    let isDark = true;
    themeToggle.addEventListener('click', () => {
      isDark = !isDark;
      document.body.classList.toggle('light-mode');
      themeToggle.textContent = isDark ? '🌙' : '☀️';
    });

    let targetScale = 0.2;
    let currentScale = 0.2;
    resSlider.addEventListener('input', () => {
      const sliderValue = parseFloat(resSlider.value);
      targetScale = (sliderValue / 60) * 0.25;
    });

    function updateScale() {
      const smoothingFactor = 0.15;
      currentScale += (targetScale - currentScale) * smoothingFactor;
      scale = currentScale;
    }

    const PALETTES = {
      extended: {
        chars: "                              .'`\"^,:;Il!i~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$".replace("\\\\/", "\\/"),
        font: 'monospace'
      },
      basic: {
        chars: " .:-=+*#%@",
        font: 'monospace'
      },
      blocks: {
        chars: " ░▒▓█",
        font: 'monospace'
      },
      matrix: {
        chars: "  .0123456789ABCDEF",
        font: 'monospace'
      },
      sketch: {
        chars: "  .,-_~:;!|/\\",
        font: 'monospace'
      },
      deep: {
        chars: "        ........:::::::::::::;;;;;;;;;;;;;;IIIIIIIIIIIIIII!l1+*#&%@$",
        font: 'monospace'
      }
    };

    function applyPalette(key) {
      if (key === 'custom') {
        const input = prompt('Enter characters from light to dark:', chars);
        if (input && input.length > 0) chars = input;
        measureCharCell();
        return;
      }
      const p = PALETTES[key] || PALETTES.extended;
      chars = p.chars;
      asciiEl.style.fontFamily = p.font;
      measureCharCell();
    }

    paletteSel.addEventListener('change', (e) => applyPalette(e.target.value));

    function measureCharCell() {
      const span = document.createElement("span");
      span.textContent = "MMMMMMMMMM";
      span.style.visibility = "hidden";
      span.style.position = "absolute";
      const st = getComputedStyle(asciiEl);
      span.style.fontFamily = st.fontFamily;
      span.style.fontSize = st.fontSize;
      span.style.lineHeight = st.lineHeight;
      document.body.appendChild(span);
      const rect = span.getBoundingClientRect();
      const measuredW = rect.width / 10;
      const lh = parseFloat(st.lineHeight);
      const measuredH = Number.isFinite(lh) && lh > 0 ? lh : rect.height;
      document.body.removeChild(span);
      if (measuredW > 0) charW = measuredW;
      if (measuredH > 0) charH = measuredH;
      charMetricsDirty = false;
    }

    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`,
    });
    selfieSegmentation.setOptions({ modelSelection: 1 });

    selfieSegmentation.onResults((results) => {
      ready = true;
      if (charMetricsDirty) measureCharCell();
      updateScale();

      const segMask = results.segmentationMask;
      const arVideo = video.videoWidth / video.videoHeight;
      const arChar = (charW / charH);
      const columns = Math.max(1, Math.floor(video.videoWidth * scale));
      const rows = Math.max(1, Math.floor(columns / (arVideo / arChar)));
      const w = columns;
      const h = rows;

      canvas.width = w;
      canvas.height = h;

      ctx.clearRect(0, 0, w, h);
      if (MIRROR) {
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(video, -w, 0, w, h);
        ctx.restore();
      } else {
        ctx.drawImage(video, 0, 0, w, h);
      }
      const frame = ctx.getImageData(0, 0, w, h);

      let maskData = null;
      if (removeBg) {
        maskCanvas.width = w;
        maskCanvas.height = h;
        mctx.clearRect(0, 0, w, h);
        if (MIRROR) {
          mctx.save();
          mctx.scale(-1, 1);
          mctx.drawImage(segMask, -w, 0, w, h);
          mctx.restore();
        } else {
          mctx.drawImage(segMask, 0, 0, w, h);
        }
        const maskImage = mctx.getImageData(0, 0, w, h);
        maskData = maskImage.data;
      }

      // --- Rendering Logic ---
      const vf = document.getElementById('viewfinder');
      const targetWidth = vf.clientWidth;
      const targetHeight = vf.clientHeight;

      let asciiString = "";

      // Text Mode
      const fontSizeByWidth = targetWidth / (w * charW / fontSize);
      const fontSizeByHeight = targetHeight / (h * charH / fontSize);
      const newFontSize = Math.floor(Math.min(fontSizeByWidth, fontSizeByHeight));

      if (newFontSize !== fontSize && newFontSize > 0) {
        fontSize = newFontSize;
        asciiEl.style.fontSize = fontSize + 'px';
        asciiEl.style.lineHeight = fontSize + 'px';
        charMetricsDirty = true;
      }

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const r = frame.data[idx];
          const g = frame.data[idx + 1];
          const b = frame.data[idx + 2];
          let brightness = 0.2126 * r + 0.7152 * g + 0.0722 * b;

          // Invert brightness in light mode so dark pixels map to dense chars
          if (!isDark) brightness = 255 - brightness;

          const maskValue = maskData ? maskData[idx] : 255;
          asciiString += (maskValue / 255) > 0.4
            ? chars[Math.floor((brightness / 255) * (chars.length - 1))]
            : ".";
        }
        asciiString += "\n";
      }
      asciiEl.textContent = asciiString;

      // --- Recording Logic: Render to hidden canvas ---
      if (isRecording) {
        const lines = asciiString.split('\n');
        const st = getComputedStyle(asciiEl);
        const fSize = parseInt(st.fontSize);
        const lHeight = parseInt(st.lineHeight) || fSize;
        const font = st.fontFamily;

        const reqW = asciiEl.clientWidth;
        const reqH = lines.length * lHeight;
        if (recordingCanvas.width !== reqW || recordingCanvas.height !== reqH) {
          recordingCanvas.width = reqW;
          recordingCanvas.height = reqH;
        }

        // Use theme colors for recording
        rctx.fillStyle = isDark ? '#121212' : '#f0f0f0';
        rctx.fillRect(0, 0, recordingCanvas.width, recordingCanvas.height);
        rctx.font = `${fSize}px ${font}`;
        rctx.fillStyle = isDark ? '#00ffcc' : '#1a1a1a';
        rctx.textBaseline = 'top';

        lines.forEach((line, i) => {
          rctx.fillText(line, 0, i * lHeight);
        });
      }

    });

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60, max: 60 } }
        });
        video.srcObject = stream;
        await new Promise((res) => (video.onloadedmetadata = res));
        // Initialize with default palette (Extended)
        applyPalette(paletteSel.value);

        async function loop() {
          await selfieSegmentation.send({ image: video });
          requestAnimationFrame(loop);
        }
        loop();
      } catch (e) {
        console.error("Error: " + e.message);
        alert("Camera access denied or not available.");
      }
    }

    start();

    // --- Mode Switching ---
    let currentMode = 'photo';
    const modePhoto = document.getElementById('mode-photo');
    const modeVideo = document.getElementById('mode-video');
    const shutterBtn = document.getElementById('shutter-btn');
    const micToggleContainer = document.getElementById('mic-toggle-container');

    modePhoto.addEventListener('click', () => setMode('photo'));
    modeVideo.addEventListener('click', () => setMode('video'));

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'photo') {
        modePhoto.classList.add('active');
        modeVideo.classList.remove('active');
        shutterBtn.title = "Capture Photo";
        micToggleContainer.style.display = 'none'; // Hide Mic in Photo mode
      } else {
        modeVideo.classList.add('active');
        modePhoto.classList.remove('active');
        shutterBtn.title = "Start Recording";
        micToggleContainer.style.display = 'flex'; // Show Mic in Video mode
      }
    }

    // --- Capture & Recording ---
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let audioStream = null;

    shutterBtn.addEventListener('click', () => {
      if (currentMode === 'photo') {
        takePhoto();
      } else {
        toggleRecording();
      }
    });

    function takePhoto() {
      const captureCanvas = document.createElement('canvas');
      const ctxCap = captureCanvas.getContext('2d');

      const lines = asciiEl.textContent.split('\n');
      const st = getComputedStyle(asciiEl);
      const fSize = parseInt(st.fontSize);
      const lHeight = parseInt(st.lineHeight) || fSize;
      const font = st.fontFamily;

      captureCanvas.width = asciiEl.clientWidth;
      captureCanvas.height = lines.length * lHeight;

      ctxCap.fillStyle = isDark ? '#121212' : '#f0f0f0';
      ctxCap.fillRect(0, 0, captureCanvas.width, captureCanvas.height);
      ctxCap.font = `${fSize}px ${font}`;
      ctxCap.fillStyle = isDark ? '#00ffcc' : '#1a1a1a';
      ctxCap.textBaseline = 'top';

      lines.forEach((line, i) => {
        ctxCap.fillText(line, 0, i * lHeight);
      });

      const link = document.createElement('a');
      link.download = `ascii-cam-${Date.now()}.png`;
      link.href = captureCanvas.toDataURL('image/png');
      link.click();

      triggerFlash();
    }

    function toggleRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    async function startRecording() {
      isRecording = true;
      shutterBtn.classList.add('recording');
      document.getElementById('rec-indicator').classList.add('rec-active');
      recordingStartTime = Date.now();
      recordingInterval = true;

      // Video Stream
      if (recordingCanvas.width === 0) {
        recordingCanvas.width = asciiEl.clientWidth;
        recordingCanvas.height = asciiEl.clientHeight;
      }
      const videoStream = recordingCanvas.captureStream(30);

      // Audio Stream (if Mic enabled)
      const micEnabled = document.getElementById('micToggle').checked;
      let combinedStream = videoStream;

      if (micEnabled) {
        try {
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          // Combine tracks
          combinedStream = new MediaStream([
            ...videoStream.getVideoTracks(),
            ...audioStream.getAudioTracks()
          ]);
        } catch (e) {
          console.error("Audio access denied:", e);
          alert("Microphone access denied. Recording video only.");
        }
      }

      mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
      recordedChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ascii-video-${Date.now()}.webm`;
        a.click();
        URL.revokeObjectURL(url);

        // Stop audio tracks if any
        if (audioStream) {
          audioStream.getTracks().forEach(track => track.stop());
          audioStream = null;
        }
      };

      mediaRecorder.start();
    }

    function stopRecording() {
      isRecording = false;
      shutterBtn.classList.remove('recording');
      document.getElementById('rec-indicator').classList.remove('rec-active');
      recordingInterval = null;

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    function triggerFlash() {
      const flash = document.createElement('div');
      flash.style.position = 'fixed';
      flash.style.top = 0; flash.style.left = 0;
      flash.style.width = '100vw'; flash.style.height = '100vh';
      flash.style.background = 'white';
      flash.style.opacity = '0.8';
      flash.style.zIndex = '9999';
      flash.style.pointerEvents = 'none';
      flash.style.transition = 'opacity 0.2s';
      document.body.appendChild(flash);
      setTimeout(() => {
        flash.style.opacity = '0';
        setTimeout(() => document.body.removeChild(flash), 200);
      }, 50);
    }

  </script>
</body>

</html>
